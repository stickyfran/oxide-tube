[package]
name = "tube-oxide"
version = "0.99.4"
edition = "2021"

[dependencies]
# Global Allocator
mimalloc = { version = "0.1", default-features = false }

# GUI
iced = { version = "0.13", features = ["tokio", "image", "advanced", "svg", "canvas", "wgpu"] }
iced_wgpu = { version = "0.13" }
raw-window-handle = "0.6"
bytes = "1.7"
crossbeam-channel = "0.5"

# Multimedia Player (libmpv)
# Linked via build.rs and system libmpv.so.2

# Networking & SIMD parsing
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "stream"] }
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
hex = "0.4"
url = "2.5"

# SQLite for cookies
rusqlite = { version = "0.32", features = ["bundled"] }

# System, D-Bus, Power & Thread Affinity
zbus = { version = "5.1", features = ["tokio"] }
core_affinity = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
chrono = "0.4"
futures-util = "0.3.34"
base64 = "0.23.1"
image = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
iced_runtime = { path = "vendor/iced_runtime" }
iced_winit = { path = "vendor/iced_winit" }
