name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  build-windows:
    name: Build Release Binary (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download libmpv dev (shinchiro)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-[0-9]*.7z' --dir mpvdev
          7z x mpvdev/*.7z -ompvdev/out -y
          find mpvdev/out -maxdepth 2 -type f
          cp mpvdev/out/libmpv.dll.a .
          cp mpvdev/out/*.dll . || true

      - name: Build release binary
        shell: bash
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package zip
        shell: bash
        run: |
          mkdir -p pkg
          cp target/x86_64-pc-windows-gnu/release/tube-oxide.exe pkg/
          cp mpvdev/out/*.dll pkg/ || true
          cp assets/icon.png pkg/ 2>/dev/null || true
          cp assets/icon.ico pkg/ 2>/dev/null || true
          7z a tube-oxide-windows-x86_64-${{ github.ref_name }}.zip ./pkg/*

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          & $iscc "/DAppVersion=${{ github.ref_name }}" installer\windows\tube-oxide.iss
          Copy-Item dist/*.exe .
          Get-ChildItem -Filter *.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            tube-oxide-windows-x86_64-${{ github.ref_name }}.zip
            tube-oxide-windows-x86_64-installer-${{ github.ref_name }}.exe

  build-release:
    name: Build Release Binary (Linux x86_64)
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmpv-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p package/bin package/share/applications package/share/icons/hicolor/scalable/apps
          cp target/release/tube-oxide package/bin/
          ln -sf tube-oxide package/bin/mitub
          cp assets/icon.png package/bin/tube-oxide.png 2>/dev/null || true
          cat << 'EOF' > package/share/applications/tube-oxide.desktop
          [Desktop Entry]
          Categories=AudioVideo;Video;Player;Network;
          Comment=Cliente Nativo de YouTube en 100% Rust (Zero-Copy Wayland + libmpv + iced)
          Exec=tube-oxide %u
          Icon=tube-oxide
          Keywords=youtube;video;streaming;media;wayland;oxide;
          Name=Tube-oxide
          NoDisplay=false
          MimeType=x-scheme-handler/vnd.youtube;x-scheme-handler/youtube;video/x-youtube;
          StartupNotify=true
          StartupWMClass=tube-oxide
          Terminal=false
          Type=Application
          EOF
          tar -czf tube-oxide-linux-x86_64-${{ github.ref_name }}.tar.gz -C package .
          cp target/release/tube-oxide tube-oxide-bin-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tube-oxide ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            tube-oxide-linux-x86_64-${{ github.ref_name }}.tar.gz
            tube-oxide-bin-linux-x86_64
            tube-oxide-windows-x86_64-${{ github.ref_name }}.zip
            tube-oxide-windows-x86_64-installer-${{ github.ref_name }}.exe
          body: |
            ## Tube-oxide ${{ github.ref_name }}
            
            Cliente nativo de YouTube desarrollado en 100% Rust sobre `iced 0.13` y `libmpv`.
            
            ### Novedades:
            - **Soporte de Enlaces de YouTube**: Apertura directa por CLI (`mitub <URL>`) e IPC de instancia única local.
            - **PiP con Aspect Ratio Perfecto**: Ajuste automático sin barras negras ni deformaciones al redimensionar.
            - **Renderizado Zero-Copy**: Decodificación acelerada por hardware directa a superficie Wayland con libmpv.
            - **Bajo consumo de memoria**: Objetivo < 350 MB RAM en reproducción activa.
