name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  build-release:
    name: Build Release Binary (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmpv-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p package/bin package/share/applications package/share/icons/hicolor/scalable/apps
          cp target/release/tube-oxide package/bin/
          ln -sf tube-oxide package/bin/mitub
          cp assets/icon.png package/bin/tube-oxide.png 2>/dev/null || true
          cat << 'EOF' > package/share/applications/tube-oxide.desktop
          [Desktop Entry]
          Categories=AudioVideo;Video;Player;Network;
          Comment=Cliente Nativo de YouTube en 100% Rust (Zero-Copy Wayland + libmpv + iced)
          Exec=tube-oxide %u
          Icon=tube-oxide
          Keywords=youtube;video;streaming;media;wayland;oxide;
          Name=Tube-oxide
          NoDisplay=false
          MimeType=x-scheme-handler/vnd.youtube;x-scheme-handler/youtube;video/x-youtube;
          StartupNotify=true
          StartupWMClass=tube-oxide
          Terminal=false
          Type=Application
          EOF
          tar -czf tube-oxide-linux-x86_64-${{ github.ref_name }}.tar.gz -C package .
          cp target/release/tube-oxide tube-oxide-bin-linux-x86_64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tube-oxide ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            tube-oxide-linux-x86_64-${{ github.ref_name }}.tar.gz
            tube-oxide-bin-linux-x86_64
          body: |
            ## Tube-oxide ${{ github.ref_name }}
            
            Cliente nativo de YouTube desarrollado en 100% Rust sobre `iced 0.13` y `libmpv`.
            
            ### Novedades:
            - **Soporte de Enlaces de YouTube**: Apertura directa por CLI (`mitub <URL>`) e IPC de instancia única local.
            - **PiP con Aspect Ratio Perfecto**: Ajuste automático sin barras negras ni deformaciones al redimensionar.
            - **Renderizado Zero-Copy**: Decodificación acelerada por hardware directa a superficie Wayland con libmpv.
            - **Bajo consumo de memoria**: Objetivo < 350 MB RAM en reproducción activa.
