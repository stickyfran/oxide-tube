name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  # Never use target-cpu=native on shared runners: rust-cache can restore
  # artifacts built on a different CPU, which then crash with SIGILL.
  RUSTFLAGS: "-C target-cpu=generic -C link-arg=-fuse-ld=mold"

jobs:
  check-and-test:
    name: Check & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmpv-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            clang \
            mold

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (release profile)
        run: cargo check --release

      - name: Cargo test
        run: cargo test --release -- --nocapture
